[project]
name = "pipeline"
version = "0.1.0"
description = "Pelintir ingestion, normalization and benchmark pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "polars>=1.43.0",
    "pyarrow>=25.0.0",
    "sentence-transformers>=5.6.1",
    "tenacity>=9.1.4",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "jupyterlab>=4.3.0",
    "matplotlib>=3.10.0",
    "pytest>=8.4.0",
    # Declared explicitly for tests/test_docs_contract.py. It already arrives as a
    # transitive dependency, but the docs contract must not break because some
    # unrelated package drops it.
    "pyyaml>=6.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
